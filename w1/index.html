<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>朋友對我的動態留言板</title>
  <style>
    /* ==========================================
       1. 全局變數定義 (方便快速修改顏色與樣式)
       ========================================== */
    :root {
      /* 【顏色修改區】 */
      --bg-color: #0b0f19;              /* 背景深色底色 */
      --card-bg: rgba(23, 32, 54, 0.7);  /* 卡片預設背景 (半透明玻璃質感) */
      --card-border: rgba(255, 255, 255, 0.1); /* 卡片預設邊框顏色 */
      --text-main: #f0f4f8;            /* 主要文字顏色 */
      --text-muted: #94a3b8;           /* 名字/次要文字顏色 */
      
      /* 【卡片高亮 (Highlight) 顏色設定】 */
      --highlight-border: #00f2fe;      /* 高亮時邊框顏色 (霓虹青) */
      --highlight-shadow: rgba(0, 242, 254, 0.6); /* 高亮發光光暈顏色 */
      --highlight-bg: rgba(15, 23, 42, 0.95);     /* 高亮時卡片背景 */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      padding: 2rem 1rem;
      /* 動態漸層背景 */
      background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, var(--bg-color) 70%);
      background-attachment: fixed;
    }

    /* 頁面標題 */
    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 2.2rem;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* ==========================================
       2. 載入中酷炫動畫 (Loading Spinner)
       ========================================== */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 300px;
    }

    /* 雙環炫光旋轉動畫 */
    .spinner {
      width: 60px;
      height: 60px;
      border: 4px solid rgba(0, 242, 254, 0.1);
      border-left-color: var(--highlight-border);
      border-right-color: #4facfe;
      border-radius: 50%;
      animation: spin 1s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
      box-shadow: 0 0 15px var(--highlight-shadow);
      margin-bottom: 1.5rem;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-text {
      color: var(--highlight-border);
      font-size: 1.1rem;
      letter-spacing: 3px;
      animation: pulse 1.5s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      0% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    /* ==========================================
       3. 瀑布流排版 (Masonry Layout)
       ========================================== */
    .masonry-wall {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      
      /* 關鍵：使用 CSS Column 實作瀑布流 */
      column-count: 4;     /* 電腦版預設 4 欄 */
      column-gap: 1.5rem;  /* 卡片之間的左右間距 */
      
      display: none;       /* 預設隱藏，資料載入完成後顯示 */
    }

    /* 響應式斷點 (RWD) 調整欄數 */
    @media (max-width: 1024px) {
      .masonry-wall { column-count: 3; }
    }
    @media (max-width: 768px) {
      .masonry-wall { column-count: 2; }
    }
    @media (max-width: 480px) {
      .masonry-wall { column-count: 1; }
    }

    /* ==========================================
       4. 留言卡片基礎與高亮特效樣式
       ========================================== */
    .card {
      /* 關鍵：防止卡片被 Column 切斷分頁 */
      break-inside: avoid;
      margin-bottom: 1.5rem;
      
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(8px);
      border-radius: 16px;
      padding: 1.25rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      
      /* 動態平滑過渡 (重點：視覺滑順感) */
      transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
      position: relative;
      cursor: pointer;
    }

    .card-header {
      display: flex;
      align-items: center;
      margin-bottom: 0.75rem;
    }

    .avatar-placeholder {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.9rem;
      color: #fff;
      margin-right: 0.75rem;
      flex-shrink: 0;
    }

    .card-author {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-muted);
      transition: color 0.6s ease;
    }

    .card-content {
      font-size: 0.95rem;
      line-height: 1.6;
      word-break: break-word;
      white-space: pre-wrap; /* 保留留言中的換行符號 */
    }

    /* ---【重點：輪播被選中時的高亮 (Highlight) 效果】--- */
    .card.highlight {
      transform: scale(1.08); /* 放大卡片 */
      z-index: 10;            /* 提升層級避免被鄰近卡片遮擋 */
      background: var(--highlight-bg);
      border-color: var(--highlight-border);
      /* 強烈的 Neon Glow 霓虹發光特效 */
      box-shadow: 0 0 25px var(--highlight-shadow), 
                  0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .card.highlight .card-author {
      color: var(--highlight-border); /* 名字著色 */
    }

    /* ---【重點：未被選中卡片的暗化與模糊效果】--- */
    .masonry-wall.has-highlight .card:not(.highlight) {
      opacity: 0.35;        /* 降溫透明度 */
      filter: blur(1.5px);  /* 輕微模糊 */
      transform: scale(0.96); /* 微微縮小 */
    }
  </style>
</head>
<body>

  <header>
    <h1>動態留言板</h1>
    <p>溫馨、熱烈與真心話展覽空間</p>
  </header>

  <!-- 載入中酷炫動畫 -->
  <div id="loading">
    <div class="spinner"></div>
    <div class="loading-text">讀取留言中...</div>
  </div>

  <!-- 留言牆容器 -->
  <div id="wall" class="masonry-wall"></div>

  <script>
    // ==========================================
    // 參數設定區 (請在下方替換你的網址與秒數)
    // ==========================================
    
    // 1. 請將下方字串替換成你複製的 Google 試算表 CSV 發佈網址
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ.../pub?output=csv';
    
    // 2. 【輪播秒數修改】設定高亮切換的間隔時間 (單位：毫秒，3000ms = 3秒)
    const CAROUSEL_INTERVAL_MS = 3000; 

    // 全局狀態變數
    let messages = [];      // 儲存解析後的留言資料
    let currentIndex = -1;  // 目前高亮的卡片索引
    let timerId = null;     // 定時器 ID

    // ==========================================
    // CSV 解析邏輯 (妥善處理內容包含逗號、換行與雙引號的情境)
    // ==========================================
    function parseCSV(text) {
      const result = [];
      let row = [];
      let field = '';
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        const nextC = text[i + 1];

        if (inQuotes) {
          if (c === '"' && nextC === '"') {
            field += '"';
            i++;
          } else if (c === '"') {
            inQuotes = false;
          } else {
            field += c;
          }
        } else {
          if (c === '"') {
            inQuotes = true;
          } else if (c === ',') {
            row.push(field.trim());
            field = '';
          } else if (c === '\r' || c === '\n') {
            row.push(field.trim());
            if (row.some(f => f.length > 0)) {
              result.push(row);
            }
            row = [];
            field = '';
            if (c === '\r' && nextC === '\n') i++;
          } else {
            field += c;
          }
        }
      }
      
      // 處理最後一行無換行符號的情況
      if (field || row.length > 0) {
        row.push(field.trim());
        if (row.some(f => f.length > 0)) {
          result.push(row);
        }
      }

      return result;
    }

    // ==========================================
    // 資料讀取與渲染
    // ==========================================
    async function initWall() {
      try {
        const response = await fetch(CSV_URL);
        const dataText = await response.text();
        const rows = parseCSV(dataText);

        // 假設 CSV 格式：第 1 欄位為姓名/暱稱，第 2 欄位為留言內容 (依實際表單欄位可自行微調)
        // 過濾掉表單標頭 (Header) 欄位
        messages = rows.slice(1).map(r => ({
          author: r[1] || '熱心朋友',
          content: r[2] || r[0] || ''
        })).filter(item => item.content.trim() !== '');

        renderCards(messages);
        
        // 隱藏 Loading，顯示留言牆
        document.getElementById('loading').style.display = 'none';
        const wall = document.getElementById('wall');
        wall.style.display = 'block';

        // 開啟動態高亮輪播
        if (messages.length > 0) {
          startCarousel();
        }

      } catch (err) {
        console.error('讀取 CSV 資料失敗：', err);
        document.querySelector('.loading-text').innerText = '載入資料失敗，請確認 CSV 網址是否正確。';
      }
    }

    // 生成卡片 DOM
    function renderCards(data) {
      const wall = document.getElementById('wall');
      wall.innerHTML = '';

      data.forEach((msg, idx) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.index = idx;

        // 取得暱稱首字做為 Avatar 視覺
        const initial = msg.author.charAt(0).toUpperCase() || '友';

        card.innerHTML = `
          <div class="card-header">
            <div class="avatar-placeholder">${initial}</div>
            <div class="card-author">${escapeHTML(msg.author)}</div>
          </div>
          <div class="card-content">${escapeHTML(msg.content)}</div>
        `;

        // 點擊卡片手動切換高亮
        card.addEventListener('click', () => {
          highlightCard(idx);
          resetCarousel();
        });

        wall.appendChild(card);
      });
    }

    // 高亮指定索引卡片
    function highlightCard(index) {
      const wall = document.getElementById('wall');
      const cards = document.querySelectorAll('.card');

      cards.forEach(card => card.classList.remove('highlight'));

      if (index >= 0 && index < cards.length) {
        currentIndex = index;
        wall.classList.add('has-highlight');
        cards[index].classList.add('highlight');

        // 平滑滾動置中 (當內容較長時提升閱讀體驗)
        cards[index].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      } else {
        wall.classList.remove('has-highlight');
      }
    }

    // 自動輪播機制
    function startCarousel() {
      timerId = setInterval(() => {
        currentIndex = (currentIndex + 1) % messages.length;
        highlightCard(currentIndex);
      }, CAROUSEL_INTERVAL_MS);
    }

    function resetCarousel() {
      clearInterval(timerId);
      startCarousel();
    }

    // 簡易 XSS 防護
    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          "'": '&#39;',
          '"': '&quot;'
        }[tag] || tag)
      );
    }

    // 初始化啟動
    window.addEventListener('DOMContentLoaded', initWall);
  </script>
</body>
</html>
