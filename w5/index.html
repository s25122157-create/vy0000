<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>雲端心電感應 (多人默契遊戲)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            // 莫蘭迪色系配置 (Morandi Palette)
            morandi: {
              bg: '#F4F1EA',       // 米灰底色
              card: '#E8E5DE',     // 淺灰卡片
              primary: '#7E8D85',  // 霧綠色
              secondary: '#B3C2C8',// 灰藍色
              accent: '#C5A059',   // 暖金/大地色
              dark: '#5A6265',     // 深灰色文字
              muted: '#A3B18A',    // 鼠尾草綠
              rose: '#D6A2AD'      // 柔粉色
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #F4F1EA;
      color: #4A5568;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    
    /* 3D 翻牌效果特有 CSS */
    .perspective-1000 {
      perspective: 1000px;
    }
    .transform-style-3d {
      transform-style: preserve-3d;
    }
    .backface-hidden {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .rotate-y-180 {
      transform: rotateY(180deg);
    }
    .card-inner {
      transition: transform 0.8s cubic-bezier(0.4, 0.2, 0.2, 1);
    }
    .card-flipped {
      transform: rotateY(180deg);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 md:p-8">

  <!-- 頂部 Header & Notion 極簡風標題 -->
  <header class="max-w-4xl mx-auto w-full flex justify-between items-center mb-8 border-b border-morandi-secondary/30 pb-4">
    <div class="flex items-center space-x-3">
      <span class="text-3xl">🧠</span>
      <div>
        <h1 class="text-2xl font-bold tracking-tight text-morandi-dark">雲端心電感應</h1>
        <p class="text-xs text-gray-500">Telepathy Game · 莫蘭迪簡約版</p>
      </div>
    </div>

    <!-- 房間與個人資訊標籤 -->
    <div id="roomInfoTag" class="hidden flex items-center space-x-2 text-sm">
      <span class="bg-morandi-card px-3 py-1 rounded-md text-morandi-dark border border-gray-300 shadow-sm">
        房號：<strong id="displayRoomId" class="text-morandi-accent">--</strong>
      </span>
      <span class="bg-morandi-card px-3 py-1 rounded-md text-morandi-dark border border-gray-300 shadow-sm">
        玩家：<strong id="displayName" class="text-morandi-primary">--</strong>
      </span>
    </div>
  </header>

  <!-- 主內容區域 -->
  <main class="max-w-4xl mx-auto w-full flex-1 flex flex-col justify-center">

    <!-- 階段一：登入/建立房間 (Setup View) -->
    <div id="viewLogin" class="bg-white/80 backdrop-blur border border-morandi-secondary/40 rounded-xl p-6 md:p-8 shadow-sm max-w-md mx-auto w-full">
      <h2 class="text-xl font-bold mb-4 text-morandi-dark flex items-center gap-2">
        <span>🚪</span> 進入或建立房間
      </h2>
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">您的暱稱</label>
          <input type="text" id="inputName" placeholder="例如：小明" class="w-full px-4 py-2 border border-morandi-secondary/50 rounded-lg focus:outline-none focus:ring-2 focus:ring-morandi-primary bg-morandi-bg/30">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">房間代碼 (Room ID)</label>
          <input type="text" id="inputRoom" placeholder="例如：101 或 party" class="w-full px-4 py-2 border border-morandi-secondary/50 rounded-lg focus:outline-none focus:ring-2 focus:ring-morandi-primary bg-morandi-bg/30">
        </div>
        <button onclick="joinGame()" class="w-full py-3 bg-morandi-primary hover:bg-morandi-dark text-white rounded-lg font-medium transition duration-200 shadow-sm">
          進入房間
        </button>
      </div>
    </div>

    <!-- 階段二：遊戲大廳/回答區 (Game Play View) -->
    <div id="viewGame" class="hidden space-y-6">

      <!-- 題目顯示區 -->
      <div class="bg-white/80 border border-morandi-secondary/40 rounded-xl p-6 text-center shadow-sm">
        <span class="text-xs uppercase tracking-widest text-morandi-accent font-bold">Current Question</span>
        <h2 id="questionTitle" class="text-2xl md:text-3xl font-bold text-morandi-dark mt-2">
          等待房主出題中...
        </h2>
      </div>

      <!-- 玩家填答區 -->
      <div id="answerSection" class="bg-white/80 border border-morandi-secondary/40 rounded-xl p-6 shadow-sm max-w-lg mx-auto w-full">
        <div class="flex gap-2">
          <input type="text" id="inputAnswer" placeholder="請輸入你的默契答案..." class="flex-1 px-4 py-2 border border-morandi-secondary/50 rounded-lg focus:outline-none focus:ring-2 focus:ring-morandi-primary bg-morandi-bg/30">
          <button onclick="submitAnswer()" class="px-6 py-2 bg-morandi-muted hover:bg-morandi-primary text-white rounded-lg font-medium transition duration-200">
            送出答案
          </button>
        </div>
        <p id="myAnswerStatus" class="text-xs text-gray-400 mt-2 text-center"></p>
      </div>

      <!-- 卡片牆：3D 翻牌顯示區 -->
      <div>
        <div class="flex justify-between items-center mb-4">
          <h3 class="text-lg font-bold text-morandi-dark flex items-center gap-2">
            <span>🎴</span> 全員答案牆 <span id="playerCount" class="text-xs font-normal text-gray-500">(0 人已作答)</span>
          </h3>
          <span id="revealStatusText" class="text-xs px-2.5 py-1 rounded bg-morandi-card text-morandi-dark font-medium">蓋牌中...</span>
        </div>
        <div id="cardsGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
          <!-- 3D 動態卡片將透過 JS 動態注入 -->
        </div>
      </div>
    </div>
  </main>

  <!-- 隱藏房主按鈕與房主控制台 modal -->
  <footer class="mt-8 text-center relative">
    <p class="text-xs text-gray-400">© Cloud Telepathy Game · Notion Style Morandi</p>
    
    <!-- 隱藏房主按鈕 (微小極簡) -->
    <button onclick="toggleHostPanel()" class="opacity-20 hover:opacity-100 transition-opacity absolute right-0 bottom-0 text-xs bg-morandi-card px-2 py-1 rounded border border-gray-300 text-gray-600">
      ⚙️ 房主控制台
    </button>
  </footer>

  <!-- 房主控制面板 (Modal) -->
  <div id="hostModal" class="hidden fixed inset-0 bg-black/30 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-white border border-morandi-secondary/50 rounded-xl p-6 max-w-md w-full shadow-lg space-y-4">
      <div class="flex justify-between items-center border-b border-gray-100 pb-2">
        <h3 class="font-bold text-morandi-dark flex items-center gap-2">👑 房主專屬控制台</h3>
        <button onclick="toggleHostPanel()" class="text-gray-400 hover:text-gray-600">✕</button>
      </div>

      <!-- 房主出題區 -->
      <div class="space-y-2">
        <label class="block text-xs font-semibold text-gray-500">出新題目 (將清空上一輪答案)</label>
        <div class="flex gap-2">
          <input type="text" id="hostQuestionInput" placeholder="例如：提到夏天會想到什麼？" class="flex-1 px-3 py-2 border rounded-lg text-sm bg-morandi-bg/20">
          <button onclick="hostSetQuestion()" class="px-4 py-2 bg-morandi-primary text-white text-sm rounded-lg hover:bg-morandi-dark">
            發布題目
          </button>
        </div>
      </div>

      <hr class="border-gray-100">

      <!-- 控制按鈕 -->
      <div class="grid grid-cols-2 gap-2">
        <button onclick="hostRevealCards()" class="py-2.5 bg-morandi-accent text-white rounded-lg text-sm font-medium hover:opacity-90 transition shadow-sm">
          🃏 全網頁同步翻牌 (開牌)
        </button>
        <button onclick="hostResetGame()" class="py-2.5 bg-morandi-rose text-white rounded-lg text-sm font-medium hover:opacity-90 transition shadow-sm">
          🔄 重置房間狀態
        </button>
      </div>
    </div>
  </div>

  <!-- JavaScript 邏輯 -->
  <script>
    // 專案設定
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbw3rlwUNisJem-iHhsVJ5GEeWkuRrVcHMcgMqucbVaoBRSXCFN2L_OGiDIo7bo8DP3VkA/exec";
    
    // 全域變數
    let currentRoom = "";
    let currentName = "";
    let pollingInterval = null;
    let localGameState = { status: "", question: "", answers: {} };

    // 1. 登入/加入房間
    function joinGame() {
      const name = document.getElementById('inputName').value.trim();
      const room = document.getElementById('inputRoom').value.trim();

      if (!name || !room) {
        alert("請輸入暱稱與房間代碼！");
        return;
      }

      currentName = name;
      currentRoom = room;

      document.getElementById('displayRoomId').innerText = currentRoom;
      document.getElementById('displayName').innerText = currentName;

      // 切換 View
      document.getElementById('viewLogin').classList.add('hidden');
      document.getElementById('viewGame').classList.remove('hidden');
      document.getElementById('roomInfoTag').classList.remove('hidden');

      // 開始啟動 Polling 機制 (每 2 秒輪詢一次)
      fetchGameState();
      pollingInterval = setInterval(fetchGameState, 2000);
    }

    // 2. GET API: 獲取遊戲狀態 (Polling)
    async function fetchGameState() {
      if (!currentRoom) return;

      try {
        const response = await fetch(`${GAS_API_URL}?room=${encodeURIComponent(currentRoom)}`);
        const data = await response.json();
        
        // 更新畫面
        updateGameUI(data);
      } catch (err) {
        console.error("Polling Error:", err);
      }
    }

    // 3. POST API: 傳送動作給 GAS
    async function sendAction(actionData) {
      try {
        await fetch(GAS_API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ room: currentRoom, ...actionData })
        });
        // 立即輪詢一次更新畫面
        fetchGameState();
      } catch (err) {
        console.error("Action Error:", err);
      }
    }

    // 4. 更新前端 UI 與卡片 (核心 3D 翻牌處理)
    function updateGameUI(data) {
      localGameState = data;

      // 更新題目
      const qTitle = document.getElementById('questionTitle');
      qTitle.innerText = data.question || "等待房主出題中...";

      // 更新狀態標籤
      const statusText = document.getElementById('revealStatusText');
      if (data.status === 'revealed') {
        statusText.innerText = "🎉 已開牌！";
        statusText.className = "text-xs px-2.5 py-1 rounded bg-morandi-accent text-white font-medium";
      } else {
        statusText.innerText = "🔒 蓋牌中...";
        statusText.className = "text-xs px-2.5 py-1 rounded bg-morandi-card text-morandi-dark font-medium";
      }

      // 更新答案牆
      const answers = data.answers || {};
      const players = Object.keys(answers);
      document.getElementById('playerCount').innerText = `(${players.length} 人已作答)`;

      // 更新個人作答狀態提示
      const myStatus = document.getElementById('myAnswerStatus');
      if (answers[currentName]) {
        myStatus.innerText = `已送出您的答案：「${answers[currentName]}」`;
      } else {
        myStatus.innerText = "";
      }

      // 渲染卡片
      renderCards(answers, data.status === 'revealed');
    }

    // 5. 渲染 3D CSS 卡片
    function renderCards(answers, isRevealed) {
      const grid = document.getElementById('cardsGrid');
      grid.innerHTML = "";

      const entries = Object.entries(answers);
      if (entries.length === 0) {
        grid.innerHTML = `<p class="col-span-full text-center text-sm text-gray-400 py-8">目前還沒有人填寫答案喔～</p>`;
        return;
      }

      entries.forEach(([player, ans]) => {
        // 卡片 DOM 結構 (3D Flip CSS)
        const cardWrapper = document.createElement('div');
        cardWrapper.className = "perspective-1000 h-32 w-full";

        cardWrapper.innerHTML = `
          <div class="card-inner relative w-full h-full transform-style-3d shadow-sm rounded-xl cursor-pointer ${isRevealed ? 'card-flipped' : ''}">
            <!-- 卡片正面 (蓋牌狀態) -->
            <div class="absolute inset-0 backface-hidden bg-morandi-card border border-morandi-secondary/30 rounded-xl flex flex-col justify-center items-center p-3 text-center">
              <span class="text-2xl mb-1">❓</span>
              <span class="text-sm font-semibold text-morandi-dark truncate w-full">${player}</span>
              <span class="text-xs text-gray-400 mt-1">已完成填答</span>
            </div>

            <!-- 卡片背面 (開牌狀態) -->
            <div class="absolute inset-0 backface-hidden rotate-y-180 bg-white border-2 border-morandi-primary rounded-xl flex flex-col justify-center items-center p-3 text-center">
              <span class="text-xs font-semibold text-morandi-muted mb-1">${player} 的答案</span>
              <span class="text-lg font-bold text-morandi-dark break-words w-full">${ans}</span>
            </div>
          </div>
        `;
        grid.appendChild(cardWrapper);
      });
    }

    // 6. 玩家動作：送出答案
    function submitAnswer() {
      const input = document.getElementById('inputAnswer');
      const ans = input.value.trim();
      if (!ans) {
        alert("請輸入答案！");
        return;
      }
      sendAction({
        action: "submit_answer",
        playerName: currentName,
        answer: ans
      });
      input.value = "";
    }

    // 7. 房主功能控制
    function toggleHostPanel() {
      const modal = document.getElementById('hostModal');
      modal.classList.toggle('hidden');
    }

    function hostSetQuestion() {
      const q = document.getElementById('hostQuestionInput').value.trim();
      if (!q) {
        alert("請輸入題目！");
        return;
      }
      sendAction({
        action: "set_question",
        question: q
      });
      document.getElementById('hostQuestionInput').value = "";
      toggleHostPanel();
    }

    function hostRevealCards() {
      sendAction({ action: "reveal" });
      toggleHostPanel();
    }

    function hostResetGame() {
      if (confirm("確定要重置目前房間的題目與所有答案嗎？")) {
        sendAction({ action: "reset" });
        toggleHostPanel();
      }
    }
  </script>
</body>
</html>
